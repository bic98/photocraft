# PAULGA Photo for Windows: build the installer and publish it as a GitHub release of this repository.
#
# Runs when a tag `paulga-v<version>` is pushed, or by hand. The release `paulga-v<version>` gets:
#   photocraft-<version>-windows-x64.msi
#   photocraft-<version>-windows-x64-portable.zip
#   latest.json   {version, url, sha256, size, publishedAt}
#
# PAULGA Studio reads `releases/latest/download/latest.json` to offer the download and, when the
# installed version is older, the update. The release is published only after every file is on
# it, so `latest.json` never names an installer that is not there.
#
# Optional repository secrets: WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
# (packaging/windows/sign.ps1). Without them the installer is unsigned and Windows warns about an
# unknown publisher.
name: PAULGA release

on:
  push:
    tags: ['paulga-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (off builds only and keeps the files as a run artifact)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paulga-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $version) { throw 'no [workspace.package] version in Cargo.toml' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "paulga-v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build and package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pwsh packaging/windows/package.ps1 -Arch x64

      - name: Describe the release
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: pwsh packaging/windows/paulga-latest.ps1 -Version $env:VERSION -Repository $env:GITHUB_REPOSITORY

      - uses: actions/upload-artifact@v4
        with:
          name: photocraft-${{ steps.version.outputs.version }}-windows-x64
          path: dist/release/
          if-no-files-found: error

      - name: Publish the release
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: pwsh packaging/windows/paulga-publish.ps1 -Version $env:VERSION -Repository $env:GITHUB_REPOSITORY -Target $env:GITHUB_SHA
